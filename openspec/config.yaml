schema: spec-driven

context: |
  This repository contains two independent Tampermonkey userscripts for ChatGPT.

  Components:

  1. Prompt Profiles
     Capability name: prompt-profiles

     Responsibilities:
     - Inject BASE instructions plus one active profile into outgoing user messages.
     - Maintain enabled/profile state per ChatGPT conversation.
     - Allow profiles to be created and edited dynamically.
     - Hide injected prompt text in the local rendered UI after sending.
     - Keep visual-only indicators out of the persisted ChatGPT message.

  2. Markdown Notes
     Capability name: markdown-notes

     Responsibilities:
     - Provide Markdown notes associated with ChatGPT conversations.
     - Persist drafts locally in the browser.
     - Save Markdown files to a user-selected local folder.
     - Keep filesystem access explicit and browser-controlled.

  Architecture constraints:

  - The two userscripts are independent components.
  - Do not introduce runtime dependencies between them unless explicitly specified.
  - Do not share mutable global state between userscripts.
  - Both scripts run entirely in the user's browser.
  - Do not introduce external network requests, telemetry, analytics, or remote storage unless explicitly required by a specification.
  - Do not hardcode personal information, filesystem paths, usernames, chat IDs, access tokens, account information, or machine-specific values.
  - Preserve Tampermonkey metadata headers.
  - Prefer browser-native APIs and vanilla JavaScript.
  - Treat ChatGPT DOM structure and selectors as unstable external dependencies.
  - DOM integrations should fail safely if ChatGPT changes its markup.
  - Existing user configuration and persisted state should remain compatible unless a change explicitly defines a migration.

  Development conventions:

  - Specifications describe observable behavior, not line-by-line implementation details.
  - Technical mechanisms belong primarily in design.md.
  - A change should identify which capability it modifies.
  - Changes affecting both scripts must explicitly explain why cross-component coordination is necessary.
  - Run JavaScript syntax validation before completing implementation.
  - Browser behavior must also be manually verified because DOM integration cannot be validated by node --check alone.

rules:
  proposal:
    - Explicitly identify whether the change affects prompt-profiles, markdown-notes, or both.
    - Describe compatibility impact on existing Tampermonkey installations.
    - Identify any changes to persisted browser state or storage schemas.
    - Avoid coupling the two scripts unless the requirement genuinely needs it.

  specs:
    - Describe externally observable behavior and user-visible outcomes.
    - Every requirement must include at least one scenario.
    - Include failure or fallback behavior when browser APIs or ChatGPT DOM elements are unavailable.
    - Keep prompt-profiles and markdown-notes requirements in their respective capability specs.

  design:
    - Document browser APIs, DOM interception, event handling, and storage mechanisms involved.
    - Document migration behavior when localStorage, IndexedDB, or GM storage schemas change.
    - For ChatGPT DOM integration, explain selector assumptions and graceful degradation.
    - For File System Access API changes, document permission behavior and browser limitations.
    - Avoid unnecessary runtime coupling between the two userscripts.

  tasks:
    - Include node --check validation for every modified userscript.
    - Include manual browser validation for behavior that depends on the ChatGPT DOM.
    - Include persistence/reload testing when localStorage, IndexedDB, or GM storage changes.
