schema: spec-driven

context: |
  This OpenSpec project governs a standalone Tampermonkey userscript for Udemy
  lecture-video notes. It is separate from the ChatGPT userscripts in this repo.

  Product:
  - Proposed source: ../udemy-markdown-notes.user.js
  - Target: Udemy course player on supported desktop browsers
  - Language: vanilla JavaScript
  - Persistence: IndexedDB drafts; explicit File System Access API filesystem saves

  Behavior:
  - One active Markdown note per Udemy lecture video, distinguished by course
    and lecture identity rather than display title alone.
  - Allow the user to create a new note or explicitly adopt an existing .md file.
  - Support Libre/Cornell modes and a read-only Markdown library preview.
  - Keep local drafts separate from on-disk saves.
  - Record course and lecture provenance without recording playback timestamps.

  Architecture constraints:
  - No dependency on ChatGPT scripts, their globals, storage keys or DOM.
  - No automatic interaction with Udemy's native Notes feature.
  - Never copy, download or extract paid course media or transcripts.
  - Treat Udemy's URL/DOM layout as unstable and fail safely.
  - Do not assume a specific Udemy Business or mobile-app DOM layout.
  - Do not make external network requests, upload notes or add telemetry.
  - Preserve existing Markdown fields and origin when adopting a file.
  - Never silently overwrite an existing or externally changed local file.

rules:
  proposal:
    - Clarify desktop Udemy hostnames and lecture-identity detection.
    - State explicit exclusions and compatibility with existing local Markdown notes.
  specs:
    - State observable behavior with at least one scenario per requirement.
    - Cover changing videos within a course and returning to a lecture.
    - Cover metadata, persistence, permissions, and missing lesson identity.
  design:
    - Explain course/video identity, SPA navigation detection and DOM stability.
    - Design safe file adoption and conflict detection.
    - Document storage keys, migrations, and browser API permissions.
  tasks:
    - Include automated JS syntax and pure-function tests.
    - Include manual Chrome/Tampermonkey tests on a real Udemy course.
